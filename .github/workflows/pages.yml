name: GitHub Pagesへ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 公開ファイルを取得
        uses: actions/checkout@v6
      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5
      - name: アプリを展開
        run: mkdir -p out && unzip -o site.zip -d out
      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
